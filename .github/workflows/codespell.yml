---
name: Reusable workflow for spellcheck with codespell

on:
  workflow_call:
    inputs:
      ignore_words_list:
        description: 'Comma-separated list of words which will be ignored by codespell.'
        type: string
        required: false
        default: ''
      skip:
        description: 'Comma-separated list of files to skip (it accepts globs as well).'
        type: string
        required: false
        default: './.git'

jobs:
  codespell:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Codespell
      uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2
      with:
        check_filenames: true
        ignore_words_list: "${{ inputs.ignore_words_list }}"
        skip: "${{ inputs.skip }}"
